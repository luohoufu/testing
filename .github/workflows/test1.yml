name: Test OSS Upload

on:
  workflow_dispatch:
    inputs:
      file-pattern:
        description: 'File pattern (e.g., *.sh)'
        required: true
        default: '*.sh'

env:
  OSS_PATH: /Release/coco/app/snapshot1

jobs:
  oss-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Upload assets to OSS
        uses: infinilabs/oss-upload@v0
        with:
          region: oss-cn-shanghai
          access-key-id: ${{ secrets.OSS_AK }}
          access-key-secret: ${{ secrets.OSS_SK }}
          bucket: ${{ secrets.OSS_BK }}
          secure: false
          local-folder: ${{ github.workspace }}/scripts
          file-pattern: ${{ inputs.file-pattern }}
          remote-dir: ${{ env.OSS_PATH }}    
      